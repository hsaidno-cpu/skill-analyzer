name: Validate SKILL ANALYZER package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install cloud and test dependencies
        run: python -m pip install -r requirements-dev-cloud.txt
      - name: Validate manifests, skills, Gateway routes, cloud files, and schemas
        run: python scripts/validate_portability.py
      - name: Run core and Gateway contract tests
        run: python -m unittest discover -s tests -v
      - name: Run cloud service tests
        run: python -m unittest discover -s service/tests -v
      - name: Check Python syntax
        run: python -m py_compile scripts/export_platforms.py scripts/validate_portability.py scripts/invoke.py tests/test_invocation_gateway.py service/app/*.py service/tests/*.py
      - name: Smoke-test Gateway CLI
        run: |
          python scripts/invoke.py list
          python scripts/invoke.py platforms
          python scripts/invoke.py resolve audit --target "CI smoke test" --platform generic --format json
      - name: Build every platform and cloud profile
        run: python scripts/export_platforms.py --target all --output ./dist
      - name: Build production container
        run: docker build -t skill-analyzer-gateway:ci .
